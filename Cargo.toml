[package]
name = "logpipe"
version = "0.1.0"
edition = "2021"
description = "Minimal log collection & ingestion framework: source -> batch -> sink"
license = "MIT"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "io-std", "io-util", "signal"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
regex = "1"
hostname = "0.4"
thiserror = "2"
serde_yaml_ng = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }

[[bin]]
name = "logpipe"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
