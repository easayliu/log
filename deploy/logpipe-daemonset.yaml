# 每个节点一个 logpipe，采集本机所有容器的 stdout/stderr 写进 ClickHouse。
# namespace/pod/container 从日志路径解出来；只有 service_name 列（pod 的 app label）
# 要问 API server，所以带一个只能 get pods 的 ServiceAccount。
---
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logpipe-config
  namespace: logging
data:
  logpipe.yaml: |
    # 采集本机所有容器的 stdout/stderr。
    # 路径、日志格式、元数据都不用配 —— 只按 k8s 的口径声明「采哪些」。

    source:
      type: kubernetes
      # 留空 = 全采。下面几项都支持 glob
      namespaces: []
      exclude_namespaces: ["kube-*"]
      pods: []
      exclude_pods: []
      containers: []
      exclude_containers: [istio-proxy, linkerd-proxy]
      # 位点落在宿主机上，Pod 重建后续读
      data_dir: /var/lib/logpipe
      # service_name 列取 pod 的哪个 label，和 trace 那边的 service 对齐。
      # 要访问 API server（下面的 ServiceAccount + ClusterRole），设成 "" 就不访问
      service_name_label: app
      # 以下都有默认值，一般不用写：
      # log_dir: /var/log/pods       kubelet 标准路径
      # exclude_self: true           不采自己
      # read_from_beginning: false   只收增量，不灌历史日志
      # glob_interval_secs: 10       多久扫一次新容器

    parser:
      # 节点上跑着几种语言栈就配几种，按顺序试，第一个匹配上的胜出。
      # 漏配的那种格式不报错，只会被当成上一条日志的堆栈续行粘上去。
      # access log 走 level（状态码折算）/ logger / message 这几个现成的列，
      # 表结构不变，加格式不用 ALTER。
      formats: [logback, gin, nginx]

    sink:
      type: clickhouse
      endpoint: http://clickhouse.logging.svc.cluster.local:8123
      database: logs
      table: app_log
      # ClickHouse 集群名。填了就写 Distributed 表、DDL 带 ON CLUSTER；
      # 改了这里要同步改 logpipe-ddl-job.yaml 的 CH_CLUSTER
      # cluster: bj_ck
      # 日志时间戳的时区，--ddl 把 timestamp 列建成带时区的 DateTime64。
      # 接 Jaeger / Grafana 必填，不然 span 按 UTC 开窗口查日志会差 8 小时
      timezone: Asia/Shanghai
      user: default
      password: ""
      timeout_secs: 30

    batch:
      max_events: 20000
      timeout_secs: 2

    pipeline:
      require_healthy: true
      # 写不进去就停下、位点不推进，Pod 重启后重读，不丢数据
      on_error: stop

    fields:
      cluster: bj-prod
---
# 只为取 pod 的 label（service_name 列）：namespace/pod/container 仍从日志路径解出，
# API server 只在每个 pod 第一次出现时被 GET 一次
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logpipe
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logpipe
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logpipe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logpipe
subjects:
  - kind: ServiceAccount
    name: logpipe
    namespace: logging
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logpipe
  namespace: logging
spec:
  selector:
    matchLabels:
      app: logpipe
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: logpipe
    spec:
      # 容器日志文件是 root 0600，必须以 root 读
      securityContext:
        runAsUser: 0
      serviceAccountName: logpipe
      # 每个节点都要采，包括打了污点的
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 60
      containers:
        - name: logpipe
          # 打 v* tag 由 CI 推到 GHCR，见 README「发布」
          image: ghcr.io/easayliu/log:v0.1.8
          args: ["/etc/logpipe/logpipe.yaml"]
          env:
            - name: RUST_LOG
              value: info
            # 用于「不采自己」。不注入也能工作：容器里的 hostname 就是 pod 名
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/logpipe
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            # 有些运行时 /var/log/pods 里是软链，指向 /var/lib/containerd，一并挂上
            - name: varlibcontainerd
              mountPath: /var/lib/containerd
              readOnly: true
            # 位点落在宿主机上，Pod 重建后能续读
            - name: checkpoints
              mountPath: /var/lib/logpipe
      volumes:
        - name: config
          configMap:
            name: logpipe-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: varlibcontainerd
          hostPath:
            path: /var/lib/containerd
            type: DirectoryOrCreate
        - name: checkpoints
          hostPath:
            path: /var/lib/logpipe
            type: DirectoryOrCreate
