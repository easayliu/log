# 建库建表。DaemonSet 之前跑一次，之后每次改了配置里的 fields 也可以重跑。
#
# 为什么要单独一个 Job：logpipe 自己从不执行 DDL，`--ddl` 只把建表语句打到 stdout
# （不连库，所以哪儿都能跑）。采集进程因此不需要建表权限，也不会在生产库里悄悄改结构。
#
# 两段式：initContainer 用 logpipe 镜像渲染 DDL 到 emptyDir，主容器用 ClickHouse 镜像
# 执行 —— logpipe 镜像是 debian-slim，里面既没有 clickhouse-client 也没有 curl。
#
# 配置来源是 DaemonSet 同一个 ConfigMap，所以列一定和 sink 写出来的字段对得上。
---
apiVersion: batch/v1
kind: Job
metadata:
  name: logpipe-ddl
  namespace: logging
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: render-ddl
          # 和 DaemonSet 用同一个 tag，否则可能渲染出跟采集端不一致的列
          image: ghcr.io/easayliu/log:v0.1.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              logpipe --ddl /etc/logpipe/logpipe.yaml > /shared/ddl.sql
              echo "--- 即将执行 ---"
              cat /shared/ddl.sql
          volumeMounts:
            - name: config
              mountPath: /etc/logpipe
              readOnly: true
            - name: shared
              mountPath: /shared
      containers:
        - name: apply-ddl
          # 建议换成你们集群自己的 CK 版本镜像
          image: clickhouse/clickhouse-server:24.8
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ch() {
                clickhouse-client --host "$CH_HOST" --user "$CH_USER" \
                  --password "$CH_PASSWORD" "$@"
              }
              # --ddl 只建表不建库，这句必须留着。集群模式下建库也要 ON CLUSTER，
              # 否则只在被连上的那个节点建出来，其他节点的本地表会因为库不存在而失败。
              if [ -n "$CH_CLUSTER" ]; then
                ch --query "CREATE DATABASE IF NOT EXISTS \`$CH_DATABASE\` ON CLUSTER \`$CH_CLUSTER\`"
              else
                ch --query "CREATE DATABASE IF NOT EXISTS \`$CH_DATABASE\`"
              fi
              # 集群模式是本地表 + Distributed 表两条语句，所以用 --queries-file
              ch --queries-file /shared/ddl.sql
              echo "建表完成"
          env:
            # 下面几项要和 ConfigMap 里 sink 的 endpoint / database / cluster / user / password 一致
            - name: CH_HOST
              value: clickhouse.logging.svc.cluster.local
            - name: CH_DATABASE
              value: logs
            # ConfigMap 里 sink 配了 cluster 的话这里填同一个集群名，留空 = 单机
            - name: CH_CLUSTER
              value: ""
            - name: CH_USER
              value: default
            - name: CH_PASSWORD
              value: ""
              # 生产上换成 Secret：
              # valueFrom:
              #   secretKeyRef: { name: clickhouse-auth, key: password }
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: config
          configMap:
            name: logpipe-config
        - name: shared
          emptyDir: {}
